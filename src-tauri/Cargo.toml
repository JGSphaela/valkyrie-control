[package]
name = "valkyrie-control"
version = "0.1.0"
description = "Valkyrie Control — Native desktop HID configurator for Valkyrie VK M3 and VK M3 Lite mice"
authors = ["Sphaela"]
license = "MIT"
edition = "2021"

[lib]
name = "valkyrie_control_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
