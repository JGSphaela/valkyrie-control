name: Build Valkyrie Control Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - 'app.css'
      - 'js/**'
      - 'assets/**'
      - '.github/workflows/build-desktop.yml'
    tags:
      - 'v*'
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci } else { npm install }

      - name: Run JavaScript unit tests
        run: npm test

      - name: Run Rust HID driver unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build Tauri desktop bundle (NSIS + portable exe)
        run: npm run tauri build

      - name: Verify built binaries
        shell: pwsh
        run: |
          if (-not (Test-Path "src-tauri/target/release/valkyrie-control.exe")) {
            throw "Missing portable binary src-tauri/target/release/valkyrie-control.exe"
          }
          $nsis = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" -ErrorAction SilentlyContinue
          if (-not $nsis) {
            throw "Missing NSIS installer in src-tauri/target/release/bundle/nsis/"
          }
          $nsis | Select-Object Name, Length

      - name: Upload Windows x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: valkyrie-control-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/valkyrie-control.exe
          if-no-files-found: error

      - name: Attach installer and portable binary to GitHub Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/valkyrie-control.exe
